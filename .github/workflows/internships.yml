name: US internships

# Refreshes README.md with every open software engineering internship in the USA and posts the new
# ones to Discord (secret DISCORD_WEBHOOK_URL). Internships listed in applied.txt are never sent.
# Scheduled runs only happen on the repository's default branch.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (off the hour, when GitHub's scheduler is less busy)
  workflow_dispatch:
    inputs:
      discord_test:
        description: "Send a test message to Discord (checks the webhook)"
        type: boolean
        default: false
  # Also run right away when you edit applied.txt, the script or this workflow (the bot's own
  # commits only touch README.md and seen.txt, so they never trigger this).
  push:
    branches: [main]
    paths:
      - "applied.txt"
      - ".github/workflows/internships.yml"
      - "find-internships.mjs"
      - "find-internships.test.mjs"

permissions:
  contents: write # commit the refreshed list

concurrency:
  group: internships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the filters
        run: node --test find-internships.test.mjs

      - name: Fetch internships, update the list, post new ones to Discord
        run: node find-internships.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TEST: ${{ inputs.discord_test }}

      # Most runs end here without a commit: the files only change when listings do.
      - name: Commit if the list changed
        run: |
          git add README.md seen.txt
          if git diff --cached --quiet; then
            echo "No change in listings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update US internships list"
          # You may have edited applied.txt on GitHub while this ran.
          git pull --rebase
          git push
